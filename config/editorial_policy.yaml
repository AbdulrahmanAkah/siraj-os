schema_version: siraj-editorial-policy-v1
policy_id: sunni-salafi-history-production-v1
status: approved
scope: global

editorial_identity:
  creed: ahl_al_sunnah_wal_jamaah
  methodology: salafi
  historical_presentation: sunni_salafi
  speculative_storytelling: prohibited

excluded_source_traditions:
  - twelver_shia
  - rafidi
  - ismaili
  - batini
  - sectarian_sources_conflicting_with_sunni_creed

source_hierarchy:
  foundational:
    - quran
    - authentic_sunnah
  principal:
    - athar
    - tafsir_bil_mathur
    - sunni_tafsir
    - sunni_history
    - sunni_prophetic_histories
  comparative:
    - israiliyyat
    - biblical_and_ancient_texts_for_origin_tracing_only

historical_sources:
  role: principal
  automatic_acceptance: false
  require_individual_report_classification: true
  preserve_isnad_when_present: true
  preserve_original_attribution: true

israiliyyat_policy:
  compatible_with_quran_sunnah_and_sunni_creed:
    usage: allowed_with_explicit_label
    certainty_language: non_assertive_unless_independently_supported

  silent_in_revelation:
    usage: allowed_with_explicit_label
    belief_posture: neither_confirm_nor_deny
    may_establish_creed: false
    may_establish_law: false

  contradicts_quran_sunnah_or_sunni_creed:
    usage: prohibited
    classification: rejected_contradictory

hadith_policy:
  final_grading_authorities: pending_human_definition
  automatic_hadith_grading: disabled
  dorar_hadith_grading:
    allowed: true
    status: temporary
    role: temporary_verification_authority
    automatic_grading: false
    exact_scholar_and_source_attribution_required: true
    human_verification_required: true
    original_source_crosscheck: preferred_when_available
  dorar_other_domains:
    allowed:
      - aqidah
      - fiqh
      - general_indexing
  preserve_existing_source_grades: true
  final_grade_requires_authorized_reference: true

claim_language_policy:
  quran_explicit:
    permitted_forms:
      - ثبت في القرآن
      - أخبر الله
      - خلق الله
  authentic_sunnah:
    permitted_forms:
      - ثبت في السنة
      - صح عن النبي
  accepted_athar:
    permitted_forms:
      - روي بإسناد مقبول
      - ورد عن بعض السلف
  scholarly_interpretation:
    permitted_forms:
      - قال عدد من المفسرين
      - رجح بعض أهل العلم
  disputed_view:
    permitted_forms:
      - اختلف أهل العلم
      - من الأقوال في المسألة
  historical_report:
    permitted_forms:
      - روى أهل التاريخ
      - ورد في بعض كتب التاريخ
  israiliyyat:
    permitted_forms:
      - ورد في بعض الإسرائيليات
      - يذكر أهل الأخبار
  weak_report:
    permitted_forms:
      - روي ولا يثبت
      - ورد بخبر ضعيف

episode_duration:
  standard_min_minutes: 18
  default_target_minutes: 22
  standard_max_minutes: 25
  segment_timings_are_estimates: true
  final_timing_authority:
    - evidence_density
    - storyboard
    - production_system
    - human_approval
  special_episode:
    may_exceed_standard_max: true
    duration: as_reasonably_required
    requires_justification: true
    requires_human_approval: true

storyboard_authority:
  may_split_provisional_units: true
  may_merge_provisional_units: true
  may_move_events_between_episodes: true
  must_preserve_verified_chronology: true
  uncertain_chronology_must_be_labeled: true
  requires_human_approval: true

verification:
  current_status: deferred
  suggestions_are_not_automatically_approved: true
  required_flow:
    - research
    - verification
    - human_approval
    - approved_evidence_package

production_policy_references:
  temporary_hadith_verification:
    file: config/temporary_hadith_verification_policy_v1.json
    status: approved
  cinematic_filler:
    file: config/cinematic_filler_policy_v1.json
    status: approved
  quran_recitation_audio:
    file: config/quran_recitation_audio_policy_v1.json
    status: approved

audio_policy:
  music: prohibited
  quran_recitation:
    audio_mode: quran_only_exclusive_audio
    narrator: muted
    ambience: muted
    sound_effects: muted

narration_intent_policy:
  historical_narration_policy_file: config/historical_narration_policy_v1.json
  creator_editorial_intent_file: config/creator_editorial_intent_v1.json
  status: approved
  unsupported_firstness: prohibited_without_direct_sound_evidence
  source_origin_trace: required
  source_names_in_narration: sparing
  source_trace_internal: always
  israiliyyat:
    may_be_used_when_noncontradictory: true
    explicit_label_required: true
    assertive_language: false
  supported_synthesis:
    allowed: true
    minimum_established_premises: 2
    premise_trace_required: true
    unproved_extensions_forbidden: true
  unknown_specifics:
    narrate_disagreement_and_lack_of_sound_determination: true
    keep_visuals_generic_and_non_identifiable: true
  future_creator_feedback:
    persist_and_generalize: true
    do_not_restart_calibration: true

source_origin_classification_policy:
  classification_file: projects/episode-001-adam/evidence/source-origin-classification-v1.json
  proposed_adjudication_file: projects/episode-001-adam/evidence/proposed-gap-adjudication-v1.json
  status: source_origin_classified_review_pending
  evidence_gate_effect: none
  automatic_evidence_approval: forbidden
  human_evidence_approval: pending
  adam:
    unsupported_firstness: prohibited
    loneliness_report:
      origin: tafsir_report_composite_chain_not_marfu
      narration: qualified_tafsir_attribution
      definite_israiliyyat_label: false
    explicit_israiliyyat_details:
      - left_rib
      - sleep_during_creation
      - place_filled_with_flesh
    supported_synthesis:
      conclusion: حواء خلقت من ضلع آدم
      premise_trace_required: true
    tree:
      specific_type_assertion: prohibited
      visual_type_identification: prohibited
      qualified_uncertainty_narration: required
